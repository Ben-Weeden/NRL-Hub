// sortable rank table
function rankTable(id,cols,rows,defcol,defdir){
  window['ST_'+id]={c:defcol==null?0:defcol,d:defdir==null?1:defdir};
  window['sort_'+id]=function(c){const st=window['ST_'+id];if(st.c===c)st.d*=-1;else{st.c=c;st.d=(c===0?1:-1);}window['draw_'+id]();};
  window['draw_'+id]=function(){
    const st=window['ST_'+id];
    const sorted=rows.slice().sort((a,b)=>{const x=a.v[st.c],y=b.v[st.c];if(typeof x==='string')return st.d*String(x).localeCompare(String(y));return st.d*((x==null?-1e9:x)-(y==null?-1e9:y));});
    const el=document.getElementById(id);
    el.innerHTML='<table class="t"><thead><tr>'+cols.map((c,i)=>'<th onclick="sort_'+id+'('+i+')">'+c+(st.c===i?(st.d<0?' ▼':' ▲'):'')+'</th>').join('')+'</tr></thead><tbody>'+
      sorted.map(r=>'<tr>'+r.cells.join('')+'</tr>').join('')+'</tbody></table>';

// ---------- COLUMN CHART (grouped) ----------
let CH=0;
function colChart(title,series,labels,opts){
  opts=opts||{};CH++;
  const n=labels.length, ns=series.length;
  const w=560,h=250,pl=44,pr=16,pt=16,pb=40,iw=w-pl-pr,ih=h-pt-pb;
  let vals=[];series.forEach(s=>s.vals.forEach(v=>{if(v!=null)vals.push(v);}));
  if(opts.ref!=null)vals.push(opts.ref);
  let mx=Math.max.apply(null,vals),mn=Math.min(0,Math.min.apply(null,vals));
  const pad=(mx-mn)*0.14||1;mx+=pad;
  const band=iw/n, outer=band*0.14, usable=band-outer*2, slot=usable/ns, bw=slot*0.82;
  const Y=v=>pt+ih*(1-(v-mn)/(mx-mn)), y0=Y(0);
  let defs='<defs>'+series.map((s,si)=>'<linearGradient id="c'+CH+'_'+si+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+s.color+'"/><stop offset="100%" stop-color="'+s.color+'" stop-opacity=".5"/></linearGradient>').join('')+'</defs>';
  let g=defs;
  for(let i=0;i<=3;i++){const yv=mn+(mx-mn)*i/3,y=Y(yv);g+='<line x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'" stroke="rgba(255,255,255,.07)"/><text x="'+(pl-7)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" font-weight="700" fill="'+MU+'">'+(opts.yFmt?opts.yFmt(yv):Math.round(yv))+'</text>';}
  if(opts.ref!=null){const y=Y(opts.ref);g+='<line x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'" stroke="#F5A623" stroke-width="1.5" stroke-dasharray="6 4"/>';}
  labels.forEach((lb,i)=>{
    const bx=pl+band*i+outer;
    series.forEach((s,si)=>{const v=s.vals[i];if(v==null)return;const x=bx+si*slot+(slot-bw)/2,y=Y(v),bh=Math.max(2,Math.abs(y0-Y(v)));const yy=v>=0?y:y0;
      g+='<rect x="'+x.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="url(#c'+CH+'_'+si+')"><title>'+lb+' — '+s.name+': '+(opts.yFmt?opts.yFmt(v):v)+'</title></rect>';});
    g+='<text transform="translate('+(pl+band*i+band/2).toFixed(1)+','+(h-pb+13)+') rotate(45)" text-anchor="start" font-size="8" font-weight="700" fill="'+MU+'">'+lb+'</text>';
  });
  const leg=ns>1?'<div class="leg">'+series.map(s=>'<span><i style="background:'+s.color+'"></i><b style="color:#fff">'+s.name+'</b></span>').join('')+'</div>':'';
  return '<div class="card" style="border-top:3px solid '+(opts.accent||series[0].color)+'"><h3 class="s">'+title+'</h3>'+leg+'<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto">'+g+'</svg></div>';
}

    {title:'BEST FIRST-HALF DEFENCE',icon:'🧱',color:'#14B8A6',val:t=>t.h1a/t.g,asc:true,fmt:v=>v.toFixed(1),sub:t=>'per game before HT'},
    {title:'BEST SECOND-HALF DEFENCE',icon:'🔒',color:'#0EA5E9',val:t=>t.h2a/t.g,asc:true,fmt:v=>v.toFixed(1),sub:t=>'per game after HT'},
  ]);
  document.getElementById('page-defence').innerHTML=
    hdr('🛡️ DEFENCE','Every team ranked on what they concede — points against per game, estimated tries conceded, defensive splits by half, and their heaviest defeat. Premierships are built here.')+
    bd+'<div style="margin:14px 0">'+chart+'</div>'+tbl;
  window.draw_def_tbl();
})();

// ================= TEAM PROFILES =================

  const opts=TEAMS.slice().sort((a,b)=>a.team.localeCompare(b.team)).map(t=>'<option value="'+t.team+'">'+t.team+'</option>').join('');
  document.getElementById('page-profiles').innerHTML=
    hdr('👥 TEAM PROFILES','Pick any team for a full analytical profile — record, form, attack and defence ranks, halves splits, home and away, advanced metrics and every result this season.')+
    '<div style="margin-bottom:14px"><select id="prof-sel" onchange="renderProfile(this.value)">'+opts+'</select></div><div id="prof-body"></div>';

    const defRank=TEAMS.slice().sort((a,b)=>a.papg-b.papg).findIndex(x=>x.team===name)+1;

    el.innerHTML=
      '<div class="card"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px"><span class="pill" style="width:44px;height:44px;font-size:16px;background:'+posColor(t.pos)+'">'+t.pos+'</span><div style="flex:1"><div style="font-size:18px;font-weight:900;color:#fff">'+t.team+'</div><div style="font-size:11px;color:'+MU+'">'+rd(t.pos)+' · '+t.w+'-'+t.d+'-'+t.l+(t.byes?' ('+t.byes+' byes)':'')+' · '+t.pts+' pts</div></div><div>'+formStrip(t.form)+'</div></div></div>'+
      chips([
        [t.pfpg.toFixed(1),rd(atkRank)+' attack','PTS FOR/GM','#22C55E'],

        [(t.diff>0?'+':'')+t.diff,'','DIFFERENTIAL',t.diff>0?'#22C55E':'#F87171'],
        [(t.pyth*100).toFixed(0)+'%','xW '+t.expW.toFixed(1),'PYTHAG WIN%','#A855F7'],
        [(t.luck>0?'+':'')+t.luck.toFixed(1),'vs expected','LUCK',t.luck>0?'#EC4899':'#F87171'],

        '<tr><td style="text-align:left">2nd half (for–against)</td><td class="'+(t.h2diff>=0?'up':'dn')+'">'+t.h2f+'–'+t.h2a+' ('+(t.h2diff>0?'+':'')+t.h2diff+')</td></tr>'+

// ================= SCOUT REPORTS =================
(function(){
  const opts=TEAMS.slice().sort((a,b)=>a.team.localeCompare(b.team)).map(t=>'<option value="'+t.team+'">'+t.team+'</option>').join('');
  document.getElementById('page-scout').innerHTML=
    hdr('🔍 SCOUT REPORTS','Pick your next opponent for an auto-generated scouting report — their tendencies, how they hurt you, where they are vulnerable, and the data-backed keys to beating them. Built from every result and half-time score this season.')+
    '<div style="margin-bottom:14px"><select id="scout-sel" onchange="renderScout(this.value)">'+opts+'</select></div><div id="scout-body"></div>';
  const rk=(t,key,asc)=>TEAMS.slice().sort((a,b)=>asc?a[key]-b[key]:b[key]-a[key]).findIndex(x=>x.team===t.team)+1;
  window.renderScout=function(name){
    const t=BY[name],el=document.getElementById('scout-body');
    const atk=rk(t,'pfpg'),def=rk(t,'papg',true),n=TEAMS.length;
    const str=[],weak=[],keys=[];
    if(atk<=Math.ceil(n/3))str.push('Elite attack — '+t.pfpg.toFixed(1)+' points a game ('+ordinal(atk)+' in the comp). Cannot be beaten in a shootout.');
    if(def<=Math.ceil(n/3))str.push('Miserly defence — just '+t.papg.toFixed(1)+' conceded a game ('+ordinal(def)+'). They strangle you.');
    if(t.h1diff>6)str.push('Fast starters — they win the first half by '+t.h1diff+' on aggregate. Weather the opening 20.');
    if(t.h2diff>6)str.push('Strong finishers — they own the second half (+'+t.h2diff+'). Do not expect them to fade.');
    if(t.cb>=2)str.push('Never dead — '+t.cb+' comeback wins from half-time deficits. A lead is not safe.');
    if(atk>=n-Math.floor(n/3))weak.push('Struggles to score — only '+t.pfpg.toFixed(1)+' a game ('+ordinal(atk)+'). Choke the ruck and they stall.');
    if(def>=n-Math.floor(n/3))weak.push('Leaky defence — concedes '+t.papg.toFixed(1)+' a game ('+ordinal(def)+'). Points are on offer.');
    if(t.h1diff<-6)weak.push('Slow starters — down '+(-t.h1diff)+' in first halves on aggregate. Jump them early and lead at the break.');
    if(t.h2diff<-6)weak.push('Fade late — outscored by '+(-t.h2diff)+' after half-time. Keep it close and take them in the final 20.');
    if(t.blown>=2)weak.push('Front-runners only — they have blown '+t.blown+' half-time leads. Stay in touch and the pressure tells.');
    if(t.vol>TEAMS.reduce((a,x)=>a+x.vol,0)/n+3)weak.push('Wildly inconsistent (±'+t.vol.toFixed(1)+' a game) — beatable on their off day.');
    if(!str.length)str.push('A balanced, middle-of-the-road side — no single elite weapon, so deny them territory and field position.');
    if(!weak.length)weak.push('Few obvious holes — this is a genuine contender. Discipline and completion will decide it.');
    // keys
    if(t.h1diff<0)keys.push('Start fast — they are vulnerable early ('+(t.h1diff)+' first-half differential).');
    else keys.push('Survive their start — weather the opening exchanges, they front-load their scoring (+'+t.h1diff+' first half).');
    if(def>=Math.ceil(n/2))keys.push('Back your attack — their defence leaks ('+t.papg.toFixed(1)+'/gm), so play territory and take your points.');
    else keys.push('Grind them down — elite defence means patience; force errors rather than forcing plays.');
    keys.push(t.h2diff>=0?'Do not let it come down to the last 20 — they finish strong (+'+t.h2diff+' second half).':'Take them late — they fade after half-time ('+t.h2diff+' second-half differential).');
    const homeAway=t.hw/(t.hw+t.hl||1)>t.aw/(t.aw+t.al||1)?'much stronger at home ('+t.hw+'-'+t.hd+'-'+t.hl+' v '+t.aw+'-'+t.ad+'-'+t.al+' away)':'travels well ('+t.aw+'-'+t.ad+'-'+t.al+' away v '+t.hw+'-'+t.hd+'-'+t.hl+' home)';
    el.innerHTML=
      '<div class="card"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span class="pill" style="width:42px;height:42px;font-size:15px;background:'+posColor(t.pos)+'">'+t.pos+'</span><div style="flex:1"><div style="font-size:17px;font-weight:900;color:#fff">'+t.team+' — scouting report</div><div style="font-size:11px;color:'+MU+'">'+ordinal(t.pos)+' · '+t.w+'-'+t.d+'-'+t.l+' · '+t.pfpg.toFixed(1)+' for / '+t.papg.toFixed(1)+' against · '+homeAway+'</div></div><div>'+formStrip(t.form)+'</div></div></div>'+
      '<div class="ch-grid">'+
        '<div class="card" style="border-left:4px solid #F87171"><h3 class="s">⚠️ THREATS — HOW THEY HURT YOU</h3>'+str.map(x=>'<div style="font-size:10.5px;color:#C0CCE0;padding:5px 0;border-top:1px solid rgba(255,255,255,.05);line-height:1.5">→ '+x+'</div>').join('')+'</div>'+
        '<div class="card" style="border-left:4px solid #4ADE80"><h3 class="s">🎯 WEAKNESSES — WHERE TO ATTACK</h3>'+weak.map(x=>'<div style="font-size:10.5px;color:#C0CCE0;padding:5px 0;border-top:1px solid rgba(255,255,255,.05);line-height:1.5">→ '+x+'</div>').join('')+'</div></div>'+
      '<div class="card" style="border-left:4px solid '+ACC+'"><h3 class="s">🔑 KEYS TO BEATING THEM</h3>'+keys.map((x,i)=>'<div style="font-size:11px;color:#fff;padding:6px 0;border-top:'+(i?'1px solid rgba(255,255,255,.05)':'none')+'"><b style="color:'+ACC+'">'+(i+1)+'.</b> '+x+'</div>').join('')+'</div>';
  };
  window.renderScout(TEAMS.slice().sort((a,b)=>a.team.localeCompare(b.team))[0].team);
})();
function ordinal(n){return n+(n===1?'st':n===2?'nd':n===3?'rd':'th');}

// ================= AI METHODOLOGY =================
(function(){
  const items=[
    ['🏉 Estimated tries','Point totals are converted to tries using the competition-wide average of <b>4.7 points per try</b> (a try plus the average conversion/penalty-goal yield). Est. tries = points ÷ 4.7. It is an estimate for comparing attacking output, not an exact try count.'],
    ['📊 Pythagorean expected win%','Borrowed from baseball and adapted for league: <b>win% = PF² ÷ (PF² + PA²)</b>. It answers "how many games should this team have won given how many points they score and concede?" Expected wins = that % × games played.'],
    ['🍀 Luck (W − xW)','Actual wins minus Pythagorean expected wins. A big positive number means a team is winning more than their scoring deserves (often close-game fortune) and may regress; a big negative means they are better than their record and are due a bounce.'],
    ['💪 Strength of schedule','The average win rate of every opponent a team has already played. A higher number means a tougher draw so far — useful for weighting every other metric.'],
    ['🎲 Scoring volatility','The standard deviation of a team’s game margins. Low = predictable, week to week; high = boom-or-bust. Great for spotting the teams capable of an upset (or a blowout loss).'],
    ['⏱️ Strike timing & halves','Using half-time scores, every game is split into two halves. We track points for and against in each half, half-time lead record, comebacks (won after trailing at HT) and blown leads (led at HT, lost). Strike timing is the share of a team’s points scored after half-time.'],
    ['📋 Computed standings','Points = 2 per win, 1 per draw, 2 per recorded bye. Ranked by points, then differential, then points for. Where a bye is not in the source data a team can sit up to two points low, so treat the table as a power ranking rather than the official ladder.'],
    ['🔍 Scout reports','Every threat, weakness and key is generated from the numbers above — attack/defence rank, halves differentials, comeback and blown-lead counts, home/away splits and volatility — thresholds tuned to the size of each competition. No opinion, just what the data says.'],
  ];
  document.getElementById('page-method').innerHTML=
    hdr('🤖 AI METHODOLOGY','Exactly how every number on this dashboard is calculated. All of it is derived from official results and half-time scores — transparent, repeatable, and the same across all five competition dashboards.')+
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">'+items.map(x=>'<div class="card" style="margin:0"><div style="font-size:12.5px;font-weight:900;color:#fff;margin-bottom:5px">'+x[0]+'</div><div style="font-size:10.5px;color:#C0CCE0;line-height:1.6">'+x[1]+'</div></div>').join('')+'</div>'+
    '<p class="note">Data source: official competition results and half-time scores, cross-referenced across the league site, rugbyleagueproject.org and club sources. Per-player enrichment (run metres, completion, play-the-ball speed) is available via the official match-centre API and can be layered onto these dashboards progressively.</p>';
})();
</script></body></html>
